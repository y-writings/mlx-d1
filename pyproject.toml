[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "mlx-d1"
version = "0.1.0"
description = "Resident decision server for LiquidAI d1"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Yoshiro M" }]
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "mcp>=2",
  "pillow>=10",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]
mlx = ["mlx-vlm>=0.7.11"]

[project.scripts]
mlx-d1 = "mlx_d1.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mlx_d1"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["mlx_d1", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
